<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 2: Advanced Web Markdown Editor</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/lib/highlight.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="toolbar">
    <button onclick="insertText('**', '**')">B</button>
    <button onclick="insertText('*', '*')"><i>I</i></button>
    <button onclick="insertText('# ')">H1</button>
    <button onclick="insertText('## ')">H2</button>
    <button onclick="insertText('> ')">Quote</button>
    <button onclick="insertText('```js\n', '\n```')">Code</button>
    <button onclick="insertText('[', '](https://)')">Link</button>
    <button onclick="insertText('![Alt Text](', ')')">Image</button>
    <button onclick="insertText('- ')">List</button>
    <button onclick="insertText('| Header | Header |\n| --- | --- |\n| Cell | Cell |')">Table</button>
    <button class="danger" onclick="clearEditor()">Clear</button>

    <div class="spacer"></div>

    <span class="stats" id="stats">Words: 0 | Chars: 0 | Lines: 0 | Paras: 0</span>
    <button onclick="copyHTML()">Copy HTML</button>
    <button onclick="downloadFile('md')">.MD</button>
    <button onclick="downloadFile('html')">.HTML</button>
    <button onclick="toggleFocus()">Focus</button>
    <button onclick="toggleTheme()">Theme</button>
  </div>

  <div class="container">
    <div class="pane editor-pane">
      <textarea id="editor" placeholder="Type your markdown here..."></textarea>
    </div>
    <div class="pane preview-pane">
      <div id="preview" class="preview"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
